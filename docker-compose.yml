
services:

  nginx:

    image: nginx:alpine

    ports:

      - "8081:80"

    volumes:

      - .:/var/www/html

      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:

      php:

        condition: service_healthy

    networks:

      - reservation_network


  php:

    image: denisiasene/gestion-reservations-salles:v1.0.3

    volumes:

      - .:/var/www/html

    depends_on:

      mysql:

        condition: service_healthy

    networks:

      - reservation_network

    healthcheck:

      test: ["CMD-SHELL", "php -r \"exit((int)!@fsockopen('127.0.0.1', 9000));\""]

      interval: 5s

      timeout: 3s

      retries: 10

      start_period: 5s


  mysql:

    image: mysql:8.0

    environment:

      MYSQL_DATABASE: ${MYSQL_DATABASE}

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:

      - mysql_data:/var/lib/mysql

    networks:

      - reservation_network

    healthcheck:

      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]

      interval: 5s

      timeout: 5s

      retries: 20

      start_period: 10s


volumes:

  mysql_data:


networks:

  reservation_network:

    driver: bridge
