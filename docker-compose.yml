services:

  nginx:
    image: nginx:alpine

    ports:
      - "8081:80"

    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    volumes:
      - .:/var/www/html

  mysql:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: reservation_salles
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: